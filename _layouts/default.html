<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | prepend: site.url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image | prepend: site.url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    {% else %}
    <meta property="og:image" content="{{ site.url }}/social-banner.png">
    {% endif %}
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ page.url | prepend: site.url }}">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    <meta name="twitter:site" content="@spendsathi">
    {% if page.image %}
    <meta name="twitter:image" content="{{ page.image | prepend: site.url }}">
    {% else %}
    <meta name="twitter:image" content="{{ site.url }}/social-banner.png">
    {% endif %}
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#16A34A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 w-full bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto w-full px-6 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2.5 group">
                <img src="/icon.png" alt="SpendSathi Logo" class="w-9 h-9 rounded-xl border border-slate-200 group-hover:scale-105 transition-transform duration-200">
                <span class="text-xl font-bold tracking-tight text-slate-900">Spend<span class="text-brand">Sathi</span></span>
            </a>
            <div class="flex items-center space-x-2">
                <a href="/blog/" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition px-3 py-2 rounded-lg hover:bg-slate-100">Blog</a>
                <a href="https://play.google.com/store/apps/details?id=com.finmate.app"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="inline-flex items-center space-x-2 text-sm font-semibold bg-slate-900 text-white px-4 py-2 rounded-full hover:bg-slate-700 transition shadow-sm">
                    <span>Get on Google Play</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 md:py-12">
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-10 items-start">
            <!-- Main Column (~70% width) -->
            <div class="w-full lg:w-[70%] min-w-0">
                {{ content }}
            </div>

            <!-- Sidebar (~30% width) -->
            <aside class="w-full lg:w-[30%] min-w-0 lg:sticky lg:top-24">
                {% include recent_posts.html %}
            </aside>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-slate-100 border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-8 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="text-center md:text-left">
                <p class="text-slate-500 text-sm">© 2026 K N Mohit Kumar Varma. All rights reserved.</p>
                <div class="flex items-center justify-center md:justify-start space-x-4 mt-1 text-xs text-slate-400">
                    <a href="/privacy.html" class="hover:text-slate-700 transition">Privacy Policy</a>
                    <span>•</span>
                    <span>Secure Android Expense Manager</span>
                </div>
            </div>
            
            <div class="flex flex-col sm:flex-row flex-wrap items-center justify-center md:justify-end gap-4 sm:gap-6 text-slate-400">
                <a href="https://programmerneeds.com/tools/spendsathi?utm_source=maker-site&amp;utm_medium=badge&amp;utm_campaign=spendsathi" target="_blank" rel="noopener" class="hover:opacity-90 transition-opacity flex items-center">
                    <img src="https://programmerneeds.com/api/badge/spendsathi?v=10" alt="Find SpendSathi on ProgrammerNeeds" width="220" height="54" class="h-10 w-auto" />
                </a>
                <a href='https://www.saashub.com/spendsathi?utm_source=badge&amp;utm_campaign=badge&amp;utm_content=spendsathi&amp;badge_variant=color&amp;badge_kind=approved' target='_blank' rel="noopener" class="hover:opacity-90 transition-opacity flex items-center">
                    <img src="https://cdn-b.saashub.com/img/badges/approved-color.png?v=1" alt="SpendSathi badge" style="max-width: 150px;" class="h-10 w-auto" />
                </a>
                <div class="flex items-center space-x-5">
                    <a href="https://x.com/spendsathi" target="_blank" rel="noopener noreferrer" class="hover:text-slate-700 transition flex items-center space-x-1.5" aria-label="Twitter / X">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    </a>
                    <a href="https://www.facebook.com/profile.php?id=61578214424919" target="_blank" rel="noopener noreferrer" class="hover:text-slate-700 transition flex items-center space-x-1.5" aria-label="Facebook">
                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    </a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
