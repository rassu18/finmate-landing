<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | prepend: site.url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    {% if page.image %}<meta property="og:image" content="{{ page.image | prepend: site.url }}">{% endif %}
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ page.url | prepend: site.url }}">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:site" content="@spendsathi">
    {% if page.image %}<meta name="twitter:image" content="{{ page.image | prepend: site.url }}">{% endif %}
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0B1120',
                        surface: '#1E293B',
                        card: '#162032',
                        gold: '#EAB308',
                        goldHover: '#CA8A04'
                    }
                }
            }
        }
    </script>
    {% seo %}
</head>
<body class="bg-navy text-slate-100 font-sans antialiased selection:bg-gold selection:text-navy min-h-screen flex flex-col">

    <!-- STICKY Top Navigation -->
    <nav class="sticky top-0 z-50 w-full bg-navy/85 backdrop-blur-md border-b border-slate-800/80 shadow-lg shadow-navy/50">
        <div class="max-w-7xl mx-auto w-full px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-3 group">
                <img src="/icon.png" alt="SpendSathi Logo" class="w-10 h-10 rounded-xl shadow-md border border-gold/30 group-hover:scale-105 transition-transform duration-200">
                <span class="text-2xl font-bold tracking-tight text-white">Spend<span class="text-gold">Sathi</span></span>
            </a>
            <div class="flex items-center space-x-3">
                <a href="/blog/" class="text-sm font-medium text-slate-300 hover:text-gold transition px-3 py-2">Blog</a>
                <a href="https://play.google.com/store/apps/details?id=com.finmate.app" 
                   target="_blank" 
                   rel="noopener noreferrer" 
                   class="inline-flex items-center space-x-2 text-sm font-semibold bg-surface border border-slate-700 hover:border-gold/50 px-4 py-2.5 rounded-xl hover:bg-slate-800 transition shadow-sm">
                    <span>Get on Google Play</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-navy max-w-7xl mx-auto w-full px-6 py-10 border-t border-slate-800 flex flex-col md:flex-row items-center justify-between gap-6">
        <div class="text-center md:text-left">
            <p class="text-slate-300 font-medium text-sm">© 2026 K N Mohit Kumar Varma. All rights reserved.</p>
            <div class="flex items-center justify-center md:justify-start space-x-4 mt-2 text-xs text-slate-500">
                <a href="/privacy.html" class="hover:text-gold transition">Privacy Policy</a>
                <span>•</span>
                <span>Secure Android Expense Manager</span>
            </div>
        </div>
        <div class="flex items-center space-x-6 text-slate-400">
            <a href="https://x.com/spendsathi" target="_blank" rel="noopener noreferrer" class="hover:text-gold transition flex items-center space-x-1.5" aria-label="Twitter">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            </a>
            <a href="https://www.facebook.com/profile.php?id=61578214424919" target="_blank" rel="noopener noreferrer" class="hover:text-gold transition flex items-center space-x-1.5" aria-label="Facebook">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
            </a>
        </div>
    </footer>

</body>
</html>
