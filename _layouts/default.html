<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | prepend: site.url }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    {% if page.image %}
    <meta property="og:image" content="{{ page.image | prepend: site.url }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    {% else %}
    <meta property="og:image" content="{{ site.url }}/social-banner.png">
    {% endif %}
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="{{ page.url | prepend: site.url }}">
    <meta name="twitter:title" content="{{ page.title | default: site.title }}">
    <meta name="twitter:description" content="{{ page.excerpt | default: page.description | default: site.description | strip_html | truncate: 160 }}">
    <meta name="twitter:site" content="@spendsathi">
    {% if page.image %}
    <meta name="twitter:image" content="{{ page.image | prepend: site.url }}">
    {% else %}
    <meta name="twitter:image" content="{{ site.url }}/social-banner.png">
    {% endif %}
    <link rel="icon" type="image/png" href="/icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#16A34A'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 w-full bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto w-full px-6 py-3 flex justify-between items-center">
            <a href="/" class="flex items-center space-x-2.5 group">
                <img src="/icon.png" alt="SpendSathi Logo" class="w-9 h-9 rounded-xl border border-slate-200 group-hover:scale-105 transition-transform duration-200">
                <span class="text-xl font-bold tracking-tight text-slate-900">Spend<span class="text-brand">Sathi</span></span>
            </a>
            <div class="flex items-center space-x-2">
                <a href="/blog/" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition px-3 py-2 rounded-lg hover:bg-slate-100">Blog</a>
                <a href="https://play.google.com/store/apps/details?id=com.finmate.app"
                   target="_blank"
                   rel="noopener noreferrer"
                   class="inline-flex items-center space-x-2 text-sm font-semibold bg-slate-900 text-white px-4 py-2 rounded-full hover:bg-slate-700 transition shadow-sm">
                    <span>Get on Google Play</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 md:py-12">
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-10 items-start">
            <!-- Main Column (~70% width) -->
            <div class="w-full lg:w-[70%] min-w-0">
                {{ content }}
            </div>

            <!-- Sidebar (~30% width) -->
            <aside class="w-full lg:w-[30%] min-w-0 lg:sticky lg:top-24">
                {% include recent_posts.html %}
            </aside>
        </div>
    </main>

    <!-- Footer -->
    {% include footer.html %}

</body>
</html>
