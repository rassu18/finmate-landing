<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    {% include head.html %}
    <style>
        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
    <!-- Skip to main content -->
    <a href="#main-content" class="skip-link sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-white focus:text-slate-900 focus:font-semibold focus:shadow-lg focus:rounded-lg focus:ring-2 focus:ring-green-600 focus:outline-none">Skip to main content</a>

    <!-- Navigation -->
    {% include header.html %}

    <!-- Main Content -->
    <main id="main-content" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 py-8 md:py-12">
        <div class="flex flex-col lg:flex-row gap-8 lg:gap-10 items-start">
            <!-- Main Column (~70% width) -->
            <div class="w-full lg:w-[70%] min-w-0">
                {{ content }}
            </div>

            <!-- Sidebar (~30% width) -->
            <aside class="w-full lg:w-[30%] min-w-0 lg:sticky lg:top-24">
                {% include recent_posts.html %}
            </aside>
        </div>
    </main>

    <!-- Footer -->
    {% include footer.html %}

</body>
</html>
