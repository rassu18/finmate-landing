name: Scheduled Pages Rebuild

on:
  schedule:
    # Run daily at midnight UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-rebuild
  cancel-in-progress: true

jobs:
  rebuild-pages:
    name: Trigger GitHub Pages Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trigger GitHub Pages Build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            core.info(`Triggering GitHub Pages build for ${context.repo.owner}/${context.repo.repo}...`);
            let buildQueued = false;

            // Attempt 1: Octokit method requestPagesBuild (plural)
            if (typeof github.rest.repos?.requestPagesBuild === 'function') {
              try {
                const response = await github.rest.repos.requestPagesBuild({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                });
                core.info(`GitHub Pages build requested via requestPagesBuild! Status: ${response.status}`);
                core.info(`Details: ${JSON.stringify(response.data)}`);
                buildQueued = true;
              } catch (err) {
                core.warning(`requestPagesBuild attempt error: ${err.message}`);
              }
            }

            // Attempt 2: Direct REST API call via github.request
            if (!buildQueued) {
              core.info('Requesting Pages build via direct REST endpoint (POST /repos/{owner}/{repo}/pages/builds)...');
              const response = await github.request('POST /repos/{owner}/{repo}/pages/builds', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              });
              core.info(`GitHub Pages build requested successfully! Status: ${response.status}`);
              core.info(`Details: ${JSON.stringify(response.data)}`);
            }
