name: Generate Bi-Weekly Blog Post

on:
  schedule:
    - cron: '0 6 * * 1,4' # Runs at 06:00 UTC on Mondays and Thursdays
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi

      - name: Run article generation script
        run: python scripts/generate_article.py
        env:
          # Inject any required API keys from GitHub Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit and push new post
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts/ assets/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(blog): auto-generate bi-weekly post"
            git push
          else
            echo "No new files generated to commit."
          fi
