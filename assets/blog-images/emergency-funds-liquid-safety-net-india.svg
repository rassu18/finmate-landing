<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0B2D2C"/>
      <stop offset="100%" stop-color="#041D1D"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <ellipse cx="260" cy="300" rx="320" ry="260" fill="url(#glow-1)" filter="url(#blur24)"/>
  <ellipse cx="940" cy="300" rx="300" ry="280" fill="url(#glow-2)" filter="url(#blur24)"/>

  <!-- Left Content: Editorial Typography -->
  <rect x="80" y="105" width="250" height="38" rx="19" fill="#134E4A" stroke="#14B8A6" stroke-width="1.4"/>
  <circle cx="102" cy="124" r="5" fill="#2DD4BF"/>
  <text x="118" y="129" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#CCFBF1" letter-spacing="1.5">FINANCIAL SECURITY</text>

  <text x="80" y="205" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Emergency Funds 2026</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1"><tspan fill="#14B8A6">The Liquid Safety Net</tspan></text>

  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">How much cash reserve do you actually need in modern India,</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">and why keeping your financial tracking private protects your peace of mind.</text>

  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(80, 445)">
    <circle cx="18" cy="18" r="18" fill="#0B2D2C" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" text-anchor="middle">MV</text>
    <text x="48" y="23" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Varma • 6 min read</text>
  </g>

  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#14B8A6">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• 100% Offline Expense Tracker</text>
  </g>


  <!-- Right Graphic: Emergency Safety Vault & Runway Ladder -->
  <g transform="translate(740, 100)">
    <!-- Vault Outer Wheel -->
    <circle cx="200" cy="200" r="180" fill="none" stroke="#334155" stroke-width="10"/>
    <circle cx="200" cy="200" r="160" fill="(14, 61, 59)" stroke="#14B8A6" stroke-width="3"/>
    
    <!-- Vault Spokes -->
    <line x1="200" y1="40" x2="200" y2="360" stroke="#334155" stroke-width="3"/>
    <line x1="40" y1="200" x2="360" y2="200" stroke="#334155" stroke-width="3"/>
    <line x1="86" y1="86" x2="314" y2="314" stroke="#334155" stroke-width="3"/>
    <line x1="86" y1="314" x2="314" y2="86" stroke="#334155" stroke-width="3"/>

    <!-- Vault Central Hub -->
    <circle cx="200" cy="200" r="85" fill="#041D1D" stroke="#14B8A6" stroke-width="3.5"/>

    <!-- Central Security Shield Motif -->
    <path d="M 200 150 L 240 168 L 240 215 C 240 242 200 258 200 258 C 200 258 160 242 160 215 L 160 168 Z" fill="#14B8A6" fill-opacity="0.25" stroke="#14B8A6" stroke-width="3"/>
    <!-- Checkmark inside shield -->
    <path d="M 188 205 L 197 214 L 214 195" fill="none" stroke="#2DD4BF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Floating Runway Pill: 6 Months Covered -->
    <g transform="translate(110, 340)">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="#134E4A" stroke="#14B8A6" stroke-width="1.5"/>
      <text x="90" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#CCFBF1" text-anchor="middle">🛡️ 6-Month Liquid Runway</text>
    </g>
  </g>

</svg>