<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16A34A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glows -->
  <ellipse cx="300" cy="300" rx="280" ry="240" fill="url(#glow-green)" filter="url(#blur24)"/>
  <ellipse cx="940" cy="315" rx="260" ry="260" fill="url(#glow-cyan)" filter="url(#blur24)"/>

  <!-- Right Visual: 50/30/20 Donut Chart & UPI Illustration -->
  <g transform="translate(730, 95)">
    <!-- Outer decorative ring -->
    <circle cx="210" cy="220" r="195" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>

    <!-- 50% Arc (Needs - Green #16A34A) -->
    <path d="M 210,35 A 185,185 0 0,1 210,405" fill="none" stroke="#16A34A" stroke-width="38" stroke-linecap="round"/>

    <!-- 30% Arc (Wants - Amber #F59E0B) -->
    <path d="M 210,405 A 185,185 0 0,1 55,140" fill="none" stroke="#F59E0B" stroke-width="38" stroke-linecap="round"/>

    <!-- 20% Arc (Savings - Cyan #06B6D4) -->
    <path d="M 55,140 A 185,185 0 0,1 210,35" fill="none" stroke="#06B6D4" stroke-width="38" stroke-linecap="round"/>

    <!-- Inner central hub -->
    <circle cx="210" cy="220" r="115" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="210" cy="220" r="95" fill="#1E293B"/>

    <!-- Center Phone / QR Symbol -->
    <g transform="translate(180, 175)">
      <rect x="0" y="0" width="60" height="90" rx="10" fill="#0F172A" stroke="#16A34A" stroke-width="2.5"/>
      <circle cx="30" cy="12" r="3" fill="#64748B"/>
      <!-- QR mini pattern inside phone -->
      <rect x="14" y="24" width="32" height="32" rx="4" fill="#16A34A" opacity="0.2"/>
      <rect x="18" y="28" width="10" height="10" fill="#22C55E"/>
      <rect x="32" y="28" width="10" height="10" fill="#22C55E"/>
      <rect x="18" y="42" width="10" height="10" fill="#22C55E"/>
      <circle cx="37" cy="47" r="4" fill="#06B6D4"/>
      <!-- Home indicator -->
      <line x1="20" y1="78" x2="40" y2="78" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Legend Labels Floating -->
    <!-- 50% Needs Tag -->
    <g transform="translate(365, 185)">
      <rect x="0" y="0" width="95" height="34" rx="17" fill="#0F172A" stroke="#16A34A" stroke-width="1.5"/>
      <circle cx="16" cy="17" r="5" fill="#16A34A"/>
      <text x="30" y="22" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">50% Needs</text>
    </g>

    <!-- 30% Wants Tag -->
    <g transform="translate(20, 360)">
      <rect x="0" y="0" width="95" height="34" rx="17" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="16" cy="17" r="5" fill="#F59E0B"/>
      <text x="30" y="22" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">30% Wants</text>
    </g>

    <!-- 20% Savings Tag -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="105" height="34" rx="17" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <circle cx="16" cy="17" r="5" fill="#06B6D4"/>
      <text x="30" y="22" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">20% Savings</text>
    </g>
  </g>

  <!-- Left Content: Editorial Typography -->
  <!-- Category Pill Badge -->
  <rect x="80" y="115" width="220" height="36" rx="18" fill="#14532D" stroke="#22C55E" stroke-width="1.2" stroke-opacity="0.6"/>
  <circle cx="102" cy="133" r="5" fill="#4ADE80"/>
  <text x="118" y="138" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#BBF7D0" letter-spacing="1.5">BUDGETING GUIDE</text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">The 50/30/20 Rule</text>
  <text x="80" y="275" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">for <tspan fill="#22C55E">UPI Spenders</tspan></text>

  <!-- Subtitle -->
  <text x="80" y="340" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#94A3B8" font-weight="400">Why classic budgeting fails in India's scan-and-pay world,</text>
  <text x="80" y="370" font-family="'Inter', system-ui, sans-serif" font-size="20" fill="#94A3B8" font-weight="400">and how automated local tracking fixes it.</text>

  <!-- Divider line -->
  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <!-- Author Meta -->
  <g transform="translate(80, 445)">
    <circle cx="16" cy="16" r="16" fill="#1E293B" stroke="#334155"/>
    <text x="16" y="21" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#22C55E" text-anchor="middle">MV</text>
    <text x="44" y="21" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Kumar Varma • 7 min read</text>
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#22C55E">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• Private Local-First Expense Tracking</text>
  </g>
</svg>
