<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0B2D2C"/>
      <stop offset="100%" stop-color="#041D1D"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <ellipse cx="260" cy="300" rx="320" ry="260" fill="url(#glow-1)" filter="url(#blur24)"/>
  <ellipse cx="940" cy="300" rx="300" ry="280" fill="url(#glow-2)" filter="url(#blur24)"/>

  <!-- Left Content: Editorial Typography -->
  <rect x="80" y="105" width="250" height="38" rx="19" fill="#134E4A" stroke="#14B8A6" stroke-width="1.4"/>
  <circle cx="102" cy="124" r="5" fill="#2DD4BF"/>
  <text x="118" y="129" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#CCFBF1" letter-spacing="1.5">CREDIT & LOANS</text>

  <text x="80" y="205" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">The 750+ CIBIL Playbook</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1"><tspan fill="#14B8A6">Boost Credit in 90 Days</tspan></text>

  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">How high credit scores unlock lowest home and car loan interest rates,</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">and why keeping your financial tracking private protects your credit profile.</text>

  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(80, 445)">
    <circle cx="18" cy="18" r="18" fill="#0B2D2C" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" text-anchor="middle">MV</text>
    <text x="48" y="23" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Varma • 8 min read</text>
  </g>

  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#14B8A6">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• 100% Offline Expense Tracker</text>
  </g>


  <!-- Right Graphic: CIBIL Score 750+ Speedometer Gauge -->
  <g transform="translate(730, 95)">
    <!-- Outer decorative ring -->
    <circle cx="210" cy="220" r="195" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6"/>
    
    <!-- Dial Background Arc (from 180 to 0 deg) -->
    <path d="M 50,220 A 160,160 0 0,1 370,220" fill="none" stroke="#1E293B" stroke-width="32" stroke-linecap="round"/>
    
    <!-- Red Zone (300-600) -->
    <path d="M 50,220 A 160,160 0 0,1 120,105" fill="none" stroke="#EF4444" stroke-width="30" stroke-linecap="round"/>
    <!-- Yellow Zone (600-750) -->
    <path d="M 120,105 A 160,160 0 0,1 270,75" fill="none" stroke="#F59E0B" stroke-width="30"/>
    <!-- Green Zone (750-900) -->
    <path d="M 270,75 A 160,160 0 0,1 370,220" fill="none" stroke="#14B8A6" stroke-width="32" stroke-linecap="round"/>

    <!-- Center Hub -->
    <circle cx="210" cy="220" r="105" fill="(14, 61, 59)" stroke="#14B8A6" stroke-width="2"/>

    <!-- Pointer Needle pointing to ~785 (around 35 deg from horizontal right) -->
    <line x1="210" y1="220" x2="310" y2="135" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="210" cy="220" r="14" fill="#14B8A6" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Digital Score Readout inside Hub -->
    <text x="210" y="275" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle">785</text>
    <rect x="145" y="295" width="130" height="26" rx="13" fill="#134E4A" stroke="#14B8A6" stroke-width="1"/>
    <text x="210" y="312" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#2DD4BF" text-anchor="middle" letter-spacing="1.5">EXCELLENT</text>
  </g>

</svg>