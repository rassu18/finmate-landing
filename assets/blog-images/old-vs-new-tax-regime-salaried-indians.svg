<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#0B2D2C"/>
      <stop offset="100%" stop-color="#041D1D"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Left Content: Editorial Typography -->
  <rect x="80" y="105" width="250" height="38" rx="19" fill="#134E4A" stroke="#14B8A6" stroke-width="1.4"/>
  <circle cx="102" cy="124" r="5" fill="#2DD4BF"/>
  <text x="118" y="129" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#CCFBF1" letter-spacing="1.5">TAX PLANNING</text>

  <text x="80" y="205" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Old vs New Tax Regime</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1"><tspan fill="#14B8A6">The Breakeven Math</tspan></text>

  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">Compare HRA, 80C deductions, and streamlined tax slabs,</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">and discover how local tracking simplifies year-end tax season.</text>

  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(80, 445)">
    <circle cx="18" cy="18" r="18" fill="#0B2D2C" stroke="#14B8A6" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#2DD4BF" text-anchor="middle">MV</text>
    <text x="48" y="23" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Varma • 9 min read</text>
  </g>

  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#14B8A6">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• 100% Offline Expense Tracker</text>
  </g>


  <!-- Right Graphic: Old vs New Tax Regime Comparison Card -->
  <g transform="translate(740, 110)">
    <!-- Comparison Card Container -->
    <rect x="0" y="0" width="370" height="370" rx="22" fill="(14, 61, 59)" stroke="#14B8A6" stroke-width="2"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="370" height="60" rx="22" fill="#134E4A"/>
    <rect x="0" y="30" width="370" height="30" fill="#134E4A"/>
    <text x="185" y="38" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="800" fill="#CCFBF1" text-anchor="middle">TAX SLAB COMPARISON</text>

    <!-- Left Column: Old Regime -->
    <g transform="translate(25, 80)">
      <rect x="0" y="0" width="150" height="180" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <text x="75" y="30" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">Old Regime</text>
      <text x="75" y="55" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#64748B" text-anchor="middle">HRA + 80C + 80D</text>
      <line x1="20" y1="75" x2="130" y2="75" stroke="#1E293B" stroke-width="1"/>
      <text x="75" y="110" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">High Deductions</text>
      <text x="75" y="145" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#F59E0B" text-anchor="middle">> ₹3.75L</text>
    </g>

    <!-- Right Column: New Regime (Winner) -->
    <g transform="translate(195, 80)">
      <rect x="0" y="0" width="150" height="180" rx="14" fill="#134E4A" stroke="#14B8A6" stroke-width="2"/>
      <text x="75" y="30" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="800" fill="#CCFBF1" text-anchor="middle">New Regime</text>
      <text x="75" y="55" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#2DD4BF" text-anchor="middle">₹75k Std Deduction</text>
      <line x1="20" y1="75" x2="130" y2="75" stroke="#14B8A6" stroke-width="1" stroke-opacity="0.4"/>
      <text x="75" y="110" font-family="'Inter', system-ui, sans-serif" font-size="11" fill="#CCFBF1" text-anchor="middle">Zero Friction</text>
      <text x="75" y="145" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">DEFAULT 🏆</text>
    </g>

    <!-- Bottom Breakeven formula banner -->
    <g transform="translate(25, 290)">
      <rect x="0" y="0" width="320" height="50" rx="14" fill="#0F172A" stroke="#14B8A6" stroke-width="1"/>
      <text x="160" y="31" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle">Breakeven: Deductions > ₹3.75 Lakhs</text>
    </g>
  </g>

</svg>