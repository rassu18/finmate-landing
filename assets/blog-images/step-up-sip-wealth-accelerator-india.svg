<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#24103B"/>
      <stop offset="100%" stop-color="#180829"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <ellipse cx="260" cy="300" rx="320" ry="260" fill="url(#glow-1)" filter="url(#blur24)"/>
  <ellipse cx="940" cy="300" rx="300" ry="280" fill="url(#glow-2)" filter="url(#blur24)"/>

  <!-- Left Content: Editorial Typography -->
  <rect x="80" y="105" width="250" height="38" rx="19" fill="#3B0764" stroke="#A855F7" stroke-width="1.4"/>
  <circle cx="102" cy="124" r="5" fill="#C084FC"/>
  <text x="118" y="129" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#E9D5FF" letter-spacing="1.5">WEALTH BUILDING</text>

  <text x="80" y="205" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Step-Up SIP Accelerator</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1"><tspan fill="#A855F7">The 10% Annual Boost</tspan></text>

  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">How indexing your mutual fund contributions to salary increments</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">cuts years off your financial independence journey in India.</text>

  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(80, 445)">
    <circle cx="18" cy="18" r="18" fill="#24103B" stroke="#A855F7" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#C084FC" text-anchor="middle">MV</text>
    <text x="48" y="23" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Varma • 8 min read</text>
  </g>

  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#A855F7">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• 100% Offline Expense Tracker</text>
  </g>


  <!-- Right Graphic: Step-Up SIP Compounding Growth Staircase -->
  <g transform="translate(740, 110)">
    <!-- Chart Background Glass Plate -->
    <rect x="0" y="0" width="380" height="380" rx="24" fill="(42, 19, 68)" fill-opacity="0.65" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Gridlines -->
    <line x1="30" y1="80" x2="350" y2="80" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
    <line x1="30" y1="160" x2="350" y2="160" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
    <line x1="30" y1="240" x2="350" y2="240" stroke="#334155" stroke-dasharray="4,4" stroke-width="1"/>
    <line x1="30" y1="320" x2="350" y2="320" stroke="#475569" stroke-width="1.5"/>

    <!-- Staircase Bars -->
    <rect x="50" y="250" width="45" height="70" rx="8" fill="#C084FC" fill-opacity="0.4"/>
    <rect x="115" y="210" width="45" height="110" rx="8" fill="#C084FC" fill-opacity="0.6"/>
    <rect x="180" y="150" width="45" height="170" rx="8" fill="#C084FC" fill-opacity="0.8"/>
    <rect x="245" y="80" width="45" height="240" rx="8" fill="#A855F7"/>

    <!-- Rising Exponential Trendline -->
    <path d="M 72 230 Q 150 180 267 60" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Arrowhead -->
    <polygon points="267,48 277,65 257,65" fill="#F59E0B"/>

    <!-- Floating Badge: +10% Annual Top-Up -->
    <g transform="translate(180, 20)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1E1B4B" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="80" y="23" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">+10% Step-Up SIP</text>
    </g>

    <!-- Floating Rupee Coin Node -->
    <g transform="translate(60, 200)">
      <circle cx="16" cy="16" r="18" fill="#F59E0B" stroke="#FEF3C7" stroke-width="2"/>
      <text x="16" y="23" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="800" fill="#78350F" text-anchor="middle">₹</text>
    </g>
  </g>

</svg>