<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="25%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2E1E09"/>
      <stop offset="100%" stop-color="#1C1206"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#334155" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <ellipse cx="260" cy="300" rx="320" ry="260" fill="url(#glow-1)" filter="url(#blur24)"/>
  <ellipse cx="940" cy="300" rx="300" ry="280" fill="url(#glow-2)" filter="url(#blur24)"/>

  <!-- Left Content: Editorial Typography -->
  <rect x="80" y="105" width="250" height="38" rx="19" fill="#451A03" stroke="#F59E0B" stroke-width="1.4"/>
  <circle cx="102" cy="124" r="5" fill="#FBBF24"/>
  <text x="118" y="129" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FEF3C7" letter-spacing="1.5">DEBT MANAGEMENT</text>

  <text x="80" y="205" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Debt Avalanche vs Snowball</text>
  <text x="80" y="268" font-family="'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1"><tspan fill="#F59E0B">for Indian Earners</tspan></text>

  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">Mathematically eliminate credit card debt and high-interest loans,</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">and why 100% private offline tracking guarantees financial consistency.</text>

  <line x1="80" y1="415" x2="600" y2="415" stroke="#334155" stroke-width="1.5"/>

  <g transform="translate(80, 445)">
    <circle cx="18" cy="18" r="18" fill="#2E1E09" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="18" y="23" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" text-anchor="middle">MV</text>
    <text x="48" y="23" font-family="'Inter', system-ui, sans-serif" font-size="15" fill="#CBD5E1" font-weight="500">By Mohit Varma • 7 min read</text>
  </g>

  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Spend<tspan fill="#F59E0B">Sathi</tspan></text>
    <text x="125" y="-1" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#64748B">• 100% Offline Expense Tracker</text>
  </g>


  <!-- Right Graphic: Debt Avalanche Credit Cards & Avalanche Payoff -->
  <g transform="translate(740, 110)">
    <!-- Back Card (Revolving Debt) -->
    <g transform="rotate(-8 170 120)">
      <rect x="30" y="50" width="310" height="190" rx="18" fill="#451A03" stroke="#F59E0B" stroke-width="2"/>
      <rect x="60" y="85" width="45" height="34" rx="6" fill="#FBBF24" fill-opacity="0.8"/>
      <text x="60" y="155" font-family="'Courier New', monospace" font-size="15" fill="#FEF3C7" letter-spacing="2">•••• •••• •••• 4281</text>
      <text x="60" y="195" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">APR: 42% REVOLVING</text>
    </g>

    <!-- Front Card (Avalanche Attack Card) -->
    <g transform="rotate(6 190 230)">
      <rect x="50" y="160" width="310" height="190" rx="18" fill="(56, 36, 13)" stroke="#F59E0B" stroke-width="2.5"/>
      <rect x="80" y="195" width="45" height="34" rx="6" fill="#FBBF24" fill-opacity="0.85"/>
      <text x="80" y="265" font-family="'Courier New', monospace" font-size="15" fill="#FFFFFF" letter-spacing="2">•••• •••• •••• 8819</text>
      <rect x="80" y="285" width="150" height="24" rx="12" fill="#451A03" stroke="#F59E0B" stroke-width="1"/>
      <text x="155" y="301" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="800" fill="#FBBF24" text-anchor="middle">DEBT CLEARED: ₹0</text>
    </g>

    <!-- Downward Payoff Trendline Badge -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="190" height="40" rx="20" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
      <text x="95" y="25" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#BBF7D0" text-anchor="middle">⚡ High APR Eliminated</text>
    </g>
