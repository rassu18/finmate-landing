  <text x="80" y="335" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">How ₹199 and ₹499 monthly auto-debits quietly compound,</text>
  <text x="80" y="365" font-family="'Inter', system-ui, sans-serif" font-size="19" fill="#94A3B8" font-weight="400">and how to audit recurring UPI mandates 100% privately.</text>

