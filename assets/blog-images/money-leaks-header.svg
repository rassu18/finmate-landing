<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="30%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </radialGradient>
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1E293B" opacity="0.8"/>
    </pattern>
    <!-- Gold glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur20">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.4"/>

  <!-- Gold ambient glow (left) -->
  <ellipse cx="320" cy="315" rx="300" ry="250" fill="url(#glow)" filter="url(#blur20)"/>

  <!-- Decorative rupee coin stack (right side) -->
  <g transform="translate(850, 160)" opacity="0.85">
    <!-- Coins stacked -->
    <ellipse cx="120" cy="320" rx="90" ry="22" fill="#CA8A04"/>
    <rect x="30" y="298" width="180" height="22" fill="#EAB308"/>
    <ellipse cx="120" cy="298" rx="90" ry="22" fill="#FDE047"/>

    <ellipse cx="120" cy="270" rx="90" ry="22" fill="#CA8A04"/>
    <rect x="30" y="248" width="180" height="22" fill="#EAB308"/>
    <ellipse cx="120" cy="248" rx="90" ry="22" fill="#FDE047"/>

    <ellipse cx="120" cy="220" rx="90" ry="22" fill="#CA8A04"/>
    <rect x="30" y="198" width="180" height="22" fill="#EAB308"/>
    <ellipse cx="120" cy="198" rx="90" ry="22" fill="#FDE047"/>

    <ellipse cx="120" cy="168" rx="90" ry="22" fill="#CA8A04"/>
    <rect x="30" y="146" width="180" height="22" fill="#EAB308"/>
    <ellipse cx="120" cy="146" rx="90" ry="22" fill="#FDE047"/>

    <!-- ₹ symbol on top coin -->
    <text x="120" y="154" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#92400E" text-anchor="middle" dominant-baseline="middle">₹</text>
  </g>

  <!-- Leak drip lines (animated feel via opacity) -->
  <g opacity="0.6">
    <line x1="966" y1="340" x2="966" y2="420" stroke="#EAB308" stroke-width="3" stroke-dasharray="6,4"/>
    <circle cx="966" cy="428" r="8" fill="#EAB308" opacity="0.7"/>

    <line x1="940" y1="330" x2="910" y2="410" stroke="#EAB308" stroke-width="2" stroke-dasharray="5,4"/>
    <circle cx="906" cy="418" r="6" fill="#EAB308" opacity="0.5"/>

    <line x1="992" y1="328" x2="1020" y2="415" stroke="#EAB308" stroke-width="2" stroke-dasharray="5,4"/>
    <circle cx="1023" cy="423" r="6" fill="#EAB308" opacity="0.5"/>
  </g>

  <!-- Left: Text content -->
  <!-- Badge pill -->
  <rect x="80" y="120" width="290" height="36" rx="18" fill="#1E293B" stroke="#EAB308" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="104" cy="138" r="6" fill="#EAB308"/>
  <text x="120" y="143" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="600" fill="#EAB308" letter-spacing="1.5">PERSONAL FINANCE</text>

  <!-- Main headline -->
  <text x="80" y="210" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1">3 Hidden Ways</text>
  <text x="80" y="272" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1">You're Leaking</text>

  <!-- "Money" in gold -->
  <text x="80" y="334" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#EAB308" letter-spacing="-1">Money</text>
  <text x="302" y="334" font-family="'Segoe UI', system-ui, sans-serif" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1"> Every Month</text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" fill="#94A3B8">And how local-first automation stops them cold.</text>

  <!-- Divider line -->
  <line x1="80" y1="422" x2="580" y2="422" stroke="#334155" stroke-width="1.5"/>

  <!-- Author / site -->
  <text x="80" y="455" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" fill="#64748B">By Mohit Kumar Varma • spendsathi.com</text>

  <!-- Bottom SpendSathi wordmark -->
  <text x="80" y="570" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Spend<tspan fill="#EAB308">Sathi</tspan></text>
  <text x="80" y="596" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#475569">Your financial data belongs to you, not our servers.</text>
</svg>
