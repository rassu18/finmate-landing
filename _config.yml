title: SpendSathi Blog
description: Personal finance insights and tips for smart Indians.
baseurl: ""
url: "https://spendsathi.com"
permalink: /blog/:year/:month/:day/:title/

# Timezone & Publishing settings
timezone: Asia/Kolkata
future: true

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude non-Jekyll files
exclude:
  - "*.bat"
  - "*.txt"
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - scripts/
