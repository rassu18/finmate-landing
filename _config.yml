title: SpendSathi Blog
description: Personal finance insights and tips for smart Indians.
baseurl: ""
url: "https://spendsathi.com"
permalink: /blog/:year/:month/:day/:title/

# Timezone & Publishing settings
timezone: Asia/Kolkata
future: true

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Include static & SEO files
include:
  - robots.txt
  - app-ads.txt
  - sitemap.xml
  - sitemap_index.xml
  - llms.txt
  - feed.xml
  - 8f4c2e9a1b7d403e9c5a2f6b8d1e4a7c.txt

# Exclude non-Jekyll files
exclude:
  - "*.bat"
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - scripts/
