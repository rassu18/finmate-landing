<div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
    <div class="flex items-center space-x-2 pb-4 mb-4 border-b border-slate-100">
        <span class="w-2 h-2 rounded-full bg-green-500"></span>
        <h3 class="text-base font-bold text-slate-900 tracking-tight">Latest Articles</h3>
    </div>
    
    <div class="divide-y divide-slate-100">
        {% for post in site.posts limit:5 %}
        <article class="py-3.5 first:pt-0 last:pb-0 group">
            <time datetime="{{ post.date | date_to_xmlschema }}" class="text-xs text-slate-400 font-medium block mb-1">
                {{ post.date | date: "%B %-d, %Y" }}
            </time>
            <h4 class="text-sm font-semibold leading-snug">
                <a href="{{ post.url | relative_url }}" class="{% if post.url == page.url %}text-green-600 font-bold{% else %}text-slate-800 group-hover:text-green-600{% endif %} transition-colors duration-150 block">
                    {{ post.title }}
                </a>
            </h4>
        </article>
        {% endfor %}
    </div>

    <div class="mt-5 pt-4 border-t border-slate-100">
        <a href="/blog/" class="text-xs font-semibold text-green-700 hover:text-green-800 inline-flex items-center space-x-1 group">
            <span>View all articles</span>
            <span class="group-hover:translate-x-0.5 transition-transform duration-150">&rarr;</span>
        </a>
    </div>
</div>
